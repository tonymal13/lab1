<!DOCTYPE html>
<html lang="ru">
<head>
	<title>Облачные технологии и ЦОД</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, viewport-fit=cover">
	<link rel="stylesheet" href="node_modules/@shower/ribbon/styles/index.css">
	<style>
		.shower { --slide-ratio: calc(16 / 9); }
	</style>
	<script src="node_modules/@shower/core/dist/index.js" defer></script>
</head>
<body class="shower list">

	<section class="slide" id="cover">
		<style>
			#cover {
				background: linear-gradient(135deg, #1a2a6c, #2a4bd7);
				color: #fff;
				position: relative;
			}
			#cover .top {
				position: absolute;
				top: 40px; left: 60px; right: 60px;
				display: flex;
				justify-content: space-between;
				gap: 40px;
			}
			#cover img {
				width: 320px;
				border-radius: 12px;
			}
			#cover .author { text-align: right; }
			#cover h2 {
				position: absolute;
				bottom: 60px; left: 60px; right: 60px;
				text-align: center;
				font-size: 44px;
				margin: 0;
			}
		</style>

		<div class="top">
			<img src="pictures/servers.png" alt="ЦОД">
			<div class="author">
				<b>Маланьин Антон Олегович, ИУ3-31М</b><br>
				<i>История появления, преимущества и риски использования</i>
			</div>
		</div>

		<h2>Облачные технологии и центры обработки данных</h2>
	</section>

</body>
</html>
